# fly.toml — Fly.io app configuration
# Run: fly launch (first time) or fly deploy (after that)

app = "AiSpend"        # change this to your actual app name
primary_region = "iad"       # virgnia — closest to usa

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true   # stops when idle to save free allowance
  auto_start_machines = true  # starts instantly on request
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Cron job — runs daily at 9am IST (3:30am UTC)
[[statics]]

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    port = 3000
    timeout = "5s"
    type = "http"
